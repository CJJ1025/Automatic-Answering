<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试本地文件访问</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .test_paper {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 3px;
        }
        .qsctt {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .xuan {
            list-style-type: none;
            padding: 0;
        }
        .xuan li {
            margin: 5px 0;
        }
        .uniterming {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="test_paper">
        <div class="qsctt">1. 以下哪个是Python的标准库？</div>
        <ul class="xuan">
            <li>A. numpy</li>
            <li>B. pandas</li>
            <li>C. os</li>
            <li>D. matplotlib</li>
        </ul>
    </div>
    
    <div class="uniterming border-all">二、多选题</div>
    <div class="test_paper">
        <div class="qsctt">2. 以下哪些是编程语言？</div>
        <ul class="xuan">
            <li>A. Python</li>
            <li>B. Java</li>
            <li>C. HTML</li>
            <li>D. CSS</li>
        </ul>
    </div>
    
    <div class="uniterming border-all">三、判断题</div>
    <div class="test_paper">
        <div class="qsctt">3. Python是一种编译型语言。</div>
        <ul class="xuan">
            <li>A. 正确</li>
            <li>B. 错误</li>
        </ul>
    </div>
</body>
</html>
